name: Build

on:
  push:
    branches: ["main", "newjs"]
  pull_request:
    branches: ["main", "newjs"]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package_runtime: [rootfull, roothide]
        license_mode: [observe, enforced]
    env:
      THEOS: ${{ github.workspace }}/theos
      TLINK_PACKAGE_RUNTIME: ${{ matrix.package_runtime }}
      TLINK_ROOTHIDE_RUNTIME: ${{ matrix.package_runtime == 'roothide' && '1' || '0' }}
      TLINK_LICENSE_MODE: ${{ matrix.license_mode }}
      TLINK_LICENSE_FORCE_ENFORCEMENT: ${{ matrix.license_mode == 'enforced' && '1' || '0' }}
      TLINK_LICENSE_ENDPOINT: ${{ vars.TLINK_LICENSE_ENDPOINT != '' && vars.TLINK_LICENSE_ENDPOINT || 'https://tlinkauto-license.tlinkauto.workers.dev' }}
      TLINK_LICENSE_KEY_ID: ${{ vars.TLINK_LICENSE_KEY_ID != '' && vars.TLINK_LICENSE_KEY_ID || 'tlinkauto-test-2026-01' }}
      TLINK_LICENSE_PUBLIC_KEY_X: ${{ vars.TLINK_LICENSE_PUBLIC_KEY_X != '' && vars.TLINK_LICENSE_PUBLIC_KEY_X || 'NxW-xzbPbNT583WwRPQOvkLaLh09hOT0JGNomDjGKtw' }}
      TLINK_LICENSE_PUBLIC_KEY_Y: ${{ vars.TLINK_LICENSE_PUBLIC_KEY_Y != '' && vars.TLINK_LICENSE_PUBLIC_KEY_Y || 'f5JiZrT7FN6WXbmbBmEynMKfirb44i4S6ljQhsvVGGM' }}
      TLINK_LICENSE_ENFORCEMENT: ${{ matrix.license_mode == 'enforced' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate license and package contracts
        run: |
          node scripts/check-rootfull-license-phase0.mjs
          node scripts/check-rootfull-license-phase1.mjs
          node scripts/check-rootfull-license-phase2.mjs
          node scripts/check-rootfull-license-phase3.mjs
          node scripts/check-rootfull-license-phase4.mjs
          node scripts/check-rootfull-license-phase5.mjs
          node scripts/check-rootfull-license-phase6.mjs
          node scripts/check-rootfull-license-authority.mjs
          node scripts/check-ocr-p0-baseline.mjs
          node scripts/check-ocr-p1-cpu-only.mjs
          node scripts/check-capture-image-optimization-v1.mjs
          node scripts/check-zoom-p0-baseline.mjs
          node scripts/check-zoom-p1-multitouch.mjs
          node scripts/check-zoom-p2-observability.mjs
          node scripts/check-smart-wait-v1.mjs
          node scripts/check-ui-tree-v1.mjs
          node scripts/check-run-history-v1.mjs
          node scripts/check-event-channel-v1.mjs
          node scripts/check-adaptive-streaming-v1.mjs
          node scripts/check-stream-capture-pipeline-v2.mjs
          node scripts/check-stream-rtc-control-v2.mjs
          node scripts/check-secure-pairing-p0.mjs
          node scripts/check-vpn-p0-baseline.mjs
          node scripts/check-vpn-p1-diagnostics.mjs
          node scripts/check-vpn-p2-rootfull-broker.mjs
          node scripts/check-vpn-p3-trollstore-foreground.mjs
          node scripts/check-vpn-p4-on-demand.mjs
          node scripts/check-vpn-p5-background-agent.mjs
          node scripts/check-roothide-build.mjs

      - name: Validate public license build inputs
        run: |
          set -euo pipefail
          case "$TLINK_LICENSE_ENDPOINT" in
            https://*) ;;
            *) echo "License endpoint must use HTTPS"; exit 1 ;;
          esac
          ! printf '%s' "$TLINK_LICENSE_ENDPOINT" | grep -Eqi 'REPLACE_|localhost|127\.0\.0\.1'
          ! printf '%s' "$TLINK_LICENSE_KEY_ID" | grep -Eqi 'REPLACE_'
          printf '%s' "$TLINK_LICENSE_PUBLIC_KEY_X" | grep -Eq '^[A-Za-z0-9_-]{43}$'
          printf '%s' "$TLINK_LICENSE_PUBLIC_KEY_Y" | grep -Eq '^[A-Za-z0-9_-]{43}$'

      - name: Configure public license verifier
        run: |
          set -euo pipefail
          PLIST="TLinkauto/TLinkauto/LicenseConfig.plist"
          /usr/libexec/PlistBuddy -c "Set :LicenseEndpoint $TLINK_LICENSE_ENDPOINT" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LicenseKeyID $TLINK_LICENSE_KEY_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LicensePublicKeyX $TLINK_LICENSE_PUBLIC_KEY_X" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LicensePublicKeyY $TLINK_LICENSE_PUBLIC_KEY_Y" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LicenseEnforcementEnabled $TLINK_LICENSE_ENFORCEMENT" "$PLIST"
          plutil -lint "$PLIST"

      - name: Verify public license key against Worker
        run: |
          node scripts/check-license-public-key.mjs \
            --endpoint "$TLINK_LICENSE_ENDPOINT" \
            --keyId "$TLINK_LICENSE_KEY_ID" \
            --publicKeyX "$TLINK_LICENSE_PUBLIC_KEY_X" \
            --publicKeyY "$TLINK_LICENSE_PUBLIC_KEY_Y"

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg
          echo "DPKG_BIN=$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_ENV"
          echo "$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_PATH"

      - name: Set up Theos
        run: |
          set -euo pipefail
          if [ "$TLINK_PACKAGE_RUNTIME" = "roothide" ]; then
            git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"
            git -C "$THEOS" submodule update --init --recursive --depth=1
          else
            git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          fi
          "$THEOS/bin/update-theos"

      - name: Ensure dm.pl is available
        run: |
          if ! command -v dm.pl >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o "$HOME/.local/bin/dm.pl"
            chmod +x "$HOME/.local/bin/dm.pl"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify OpenCV framework
        run: |
          if [ ! -d "frameworks/opencv2.framework" ]; then
            echo "Missing frameworks/opencv2.framework. Please add the prebuilt framework to the repo."
            exit 1
          fi

      - name: Build TLinkauto app bundle
        run: |
          set -euo pipefail
          XCODE_RUNTIME_SETTINGS=()
          APP_ENTITLEMENTS="layout/entitlements.plist"
          SHORTCUT_ENTITLEMENTS="layout/shortcut-entitlements.plist"
          if [ "$TLINK_PACKAGE_RUNTIME" = "roothide" ]; then
            XCODE_RUNTIME_SETTINGS=(ARCHS=arm64 ONLY_ACTIVE_ARCH=YES IPHONEOS_DEPLOYMENT_TARGET=15.0)
            APP_ENTITLEMENTS="layout/entitlements-roothide.plist"
            SHORTCUT_ENTITLEMENTS="layout/shortcut-entitlements-roothide.plist"
          fi
          xcodebuild \
            -project TLinkauto/TLinkauto.xcodeproj \
            -target TLinkauto \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) TLINK_LICENSE_FORCE_ENFORCEMENT=${TLINK_LICENSE_FORCE_ENFORCEMENT} TLINK_LICENSE_ROOTFULL_RUNTIME=1 TLINK_ROOTHIDE_RUNTIME=${TLINK_ROOTHIDE_RUNTIME}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${XCODE_RUNTIME_SETTINGS[@]}" \
            build

          APP_PATH="$PWD/build/Release-iphoneos/TLinkauto.app"
          if [ -z "$APP_PATH" ]; then
            echo "TLinkauto.app was not produced by xcodebuild"
            exit 1
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "TLinkauto.app was not produced at $APP_PATH"
            exit 1
          fi

          rm -rf layout/Applications/TLinkauto.app
          mkdir -p layout/Applications
          cp -R "$APP_PATH" layout/Applications/TLinkauto.app

          find layout/Applications/TLinkauto.app -name _CodeSignature -type d -prune -exec rm -rf {} +
          find layout/Applications/TLinkauto.app -name embedded.mobileprovision -type f -delete

          cp RootfullLicenseBuild.plist layout/Applications/TLinkauto.app/RootfullLicenseBuild.plist
          cp TLinkauto/TLinkauto/LicenseConfig.plist layout/Applications/TLinkauto.app/LicenseConfig.plist
          /usr/libexec/PlistBuddy \
            -c "Set :RootfullLicenseMode ${TLINK_LICENSE_MODE}" \
            layout/Applications/TLinkauto.app/RootfullLicenseBuild.plist

          chmod +x layout/Applications/TLinkauto.app/TLinkauto
          if [ -f layout/Applications/TLinkauto.app/PlugIns/shortcutext.appex/shortcutext ]; then
            chmod +x layout/Applications/TLinkauto.app/PlugIns/shortcutext.appex/shortcutext
            codesign --force --sign - --entitlements "$SHORTCUT_ENTITLEMENTS" layout/Applications/TLinkauto.app/PlugIns/shortcutext.appex
          fi
          codesign --force --sign - --entitlements "$APP_ENTITLEMENTS" layout/Applications/TLinkauto.app

          codesign -d --entitlements :- layout/Applications/TLinkauto.app | grep platform-application

      - name: Build package
        run: |
          export PATH="${DPKG_BIN}:$PATH"
          make package FINALPACKAGE=1 \
            TLINK_LICENSE_MODE="${TLINK_LICENSE_MODE}" \
            TLINK_PACKAGE_RUNTIME="${TLINK_PACKAGE_RUNTIME}"

      - name: Validate phase 6 artifact
        run: |
          set -euo pipefail
          export PATH="${DPKG_BIN}:$PATH"
          DEB_PATH="$(find packages -type f -name '*.deb' -print -quit)"
          test -n "$DEB_PATH"
          EXPECTED_ARCH="iphoneos-arm"
          if [ "$TLINK_PACKAGE_RUNTIME" = "roothide" ]; then
            EXPECTED_ARCH="iphoneos-arm64e"
          fi
          test "$(dpkg-deb -f "$DEB_PATH" Architecture)" = "$EXPECTED_ARCH"
          ROOTFS="$RUNNER_TEMP/${TLINK_PACKAGE_RUNTIME}-${TLINK_LICENSE_MODE}"
          rm -rf "$ROOTFS"
          mkdir -p "$ROOTFS"
          dpkg-deb -x "$DEB_PATH" "$ROOTFS"
          node scripts/validate-rootfull-license-phase6-artifact.mjs \
            --rootfs "$ROOTFS" \
            --runtime "$TLINK_PACKAGE_RUNTIME" \
            --mode "$TLINK_LICENSE_MODE" \
            --endpoint "$TLINK_LICENSE_ENDPOINT" \
            --keyId "$TLINK_LICENSE_KEY_ID" \
            --publicKeyX "$TLINK_LICENSE_PUBLIC_KEY_X" \
            --publicKeyY "$TLINK_LICENSE_PUBLIC_KEY_Y" \
            --output "${TLINK_PACKAGE_RUNTIME}-license-phase6-${TLINK_LICENSE_MODE}.json"

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: TLinkauto-${{ matrix.package_runtime }}-deb-${{ matrix.license_mode }}
          path: |
            packages/*.deb
            ${{ matrix.package_runtime }}-license-phase6-${{ matrix.license_mode }}.json
