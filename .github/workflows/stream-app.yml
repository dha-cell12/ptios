      - name: Build and package TrollStore .tipa
        working-directory: stream-app
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1

      - name: Validate package
        run: |
          set -euo pipefail
          test -f "$TIPA_PATH"
          unzip -l "$TIPA_PATH" | tee stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/Info.plist' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/StreamControl' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/streamd' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/privhelper' stream-app/packages/StreamControl.tipa.contents.txt

          APP="stream-app/app/.theos/_/Applications/StreamControl.app"
          if [ ! -d "$APP" ]; then
            APP=$(find stream-app/app/.theos/_ -maxdepth 8 -name 'StreamControl.app' -type d | head -n1)
          fi
          test -d "$APP"
          test -x "$APP/StreamControl"
          test -x "$APP/streamd"
          test -x "$APP/privhelper"

          echo "--- StreamControl entitlements ---"
          ldid -e "$APP/StreamControl" || true
          echo "--- streamd entitlements ---"
          ldid -e "$APP/streamd" || true
          echo "--- privhelper entitlements ---"
          ldid -e "$APP/privhelper" || true
          echo "--- bundle files ---"
          find "$APP" -maxdepth 2 -type f | sort

      - name: Upload TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: StreamControl-tipa
          path: |
            stream-app/packages/StreamControl.tipa
            stream-app/packages/StreamControl.tipa.contents.txt
          if-no-files-found: error
