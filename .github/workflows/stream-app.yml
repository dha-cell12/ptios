name: Build StreamControl TrollStore

on:
  push:
    paths:
      - 'stream-app/**'
      - '.github/workflows/stream-app.yml'
  pull_request:
    paths:
      - 'stream-app/**'
      - '.github/workflows/stream-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      APP_NAME: StreamControl
      APP_BUNDLE: StreamControl.app
      TIPA_PATH: stream-app/packages/StreamControl.tipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          brew install ldid xz

      - name: Set up Theos
        run: |
          set -euo pipefail
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Download iOS SDKs
        run: |
          set -euo pipefail
          cd "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk . || true
          rm -rf sdks-master sdks.zip
          test -n "$(find . -maxdepth 1 -name '*.sdk' -type d | head -n1)"
          ls -1

      - name: Sanity check StreamControl sources
        run: |
          set -euo pipefail
          test -f stream-app/Makefile
          test -f stream-app/app/Makefile
          test -f stream-app/streamd/Makefile
          test -f stream-app/privhelper/Makefile
          test -f stream-app/privhelper/main.mm
          test -f stream-app/app/TLinkSocketClient.mm
          test -f stream-app/app/ScriptsViewController.mm
          test -f stream-app/app/ScriptEditorViewController.mm
          test -f stream-app/app/ScriptLogViewController.mm
          test -f stream-app/app/SettingsViewController.mm
          grep -q 'privhelper' stream-app/Makefile
          grep -q '<string>privhelper</string>' stream-app/app/Info.plist
          grep -q 'TLinkSocketClient.mm' stream-app/app/Makefile
          grep -q 'startVisualFeedbackMonitor' stream-app/app/AppDelegate.mm
          grep -q 'showToastOverlayWithMessage' stream-app/app/AppDelegate.mm
          grep -q 'ScriptsViewController.mm' stream-app/app/Makefile
          grep -q 'ScriptEditorViewController.mm' stream-app/app/Makefile
          grep -q 'ScriptLogViewController.mm' stream-app/app/Makefile
          grep -q 'SettingsViewController.mm' stream-app/app/Makefile
          grep -q 'QuartzCore' stream-app/app/Makefile
          grep -q 'Restart streamd' stream-app/app/ViewController.mm
          grep -q -- '- (void)restart' stream-app/app/StreamSupervisor.mm
          grep -q 'runPrivhelperKillStreamdLocked' stream-app/app/StreamSupervisor.mm
          grep -q 'refusing to spawn because tcp/6000 is still occupied' stream-app/app/StreamSupervisor.mm
          grep -q -- '--open-bundle' stream-app/privhelper/main.mm
          grep -q -- '--kill-bundle' stream-app/privhelper/main.mm
          grep -q -- '--open-url' stream-app/privhelper/main.mm
          grep -q 'TLinkStartTaskServer' stream-app/streamd/main.mm
          grep -q 'unsupported_on_trollstore' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 96' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 11' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 12' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 19' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 20' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 22' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 23' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 26' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 27' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 28' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 31' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 54' stream-app/streamd/POCSocketServer.mm
          grep -q 'FrontBoardServices' stream-app/streamd/POCSocketServer.mm
          grep -q 'frontmost_cache' stream-app/streamd/POCSocketServer.mm
          grep -q 'task11:expected' stream-app/streamd/POCSocketServer.mm
          grep -q 'launch_via_privhelper' stream-app/streamd/POCSocketServer.mm
          grep -q 'launch_helper_failed_or_limited_on_trollstore' stream-app/streamd/POCSocketServer.mm
          grep -q 'kill_app_via_privhelper' stream-app/streamd/POCSocketServer.mm
          grep -q 'open_url_via_privhelper' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 47' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 48' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 49' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 66' stream-app/streamd/POCSocketServer.mm
          grep -q 'taskType == 70' stream-app/streamd/POCSocketServer.mm
          grep -q 'Vision ImageIO JavaScriptCore' stream-app/streamd/Makefile
          grep -q '"tlinkauto"' stream-app/streamd/POCSocketServer.mm
          grep -q '"visionOCR"' stream-app/streamd/POCSocketServer.mm
          grep -q 'scriptJS' stream-app/streamd/POCSocketServer.mm
          grep -q 'scriptTaskBridge' stream-app/streamd/POCSocketServer.mm
          grep -q 'visual_feedback' stream-app/streamd/POCSocketServer.mm
          grep -q 'TLinkRecordToast' stream-app/streamd/POCSocketServer.mm
          grep -q 'TLinkHandleAlertBox' stream-app/streamd/POCSocketServer.mm
          grep -q 'TLinkHandleTouchIndicator' stream-app/streamd/POCSocketServer.mm
          grep -q 'TLinkHandlePlayScript' stream-app/streamd/POCSocketServer.mm
          grep -q '"appMgmtMode"' stream-app/streamd/POCSocketServer.mm
          grep -q '"keyboardClipboard"' stream-app/streamd/POCSocketServer.mm
          grep -q 'OCR Languages' stream-app/app/SettingsViewController.mm
          grep -q 'Script Status' stream-app/app/SettingsViewController.mm
          grep -q 'Script Runtime: javascriptcore_mvp' stream-app/app/SettingsViewController.mm
          grep -q 'Toast Overlay' stream-app/app/SettingsViewController.mm
          grep -q 'Alert Box' stream-app/app/SettingsViewController.mm
          grep -q 'Touch Indicator On' stream-app/app/SettingsViewController.mm
          grep -q 'App Info Self' stream-app/app/SettingsViewController.mm
          grep -q 'createDemoScript' stream-app/app/ScriptsViewController.mm
          grep -q 'showAddMenu' stream-app/app/ScriptsViewController.mm
          grep -q 'New File' stream-app/app/ScriptsViewController.mm
          grep -q 'New Folder' stream-app/app/ScriptsViewController.mm
          grep -q 'openEditorForEntry' stream-app/app/ScriptsViewController.mm
          grep -q 'playButtonTapped' stream-app/app/ScriptsViewController.mm
          grep -q 'play.circle.fill' stream-app/app/ScriptsViewController.mm
          grep -q 'SCScriptEditorViewController' stream-app/app/ScriptEditorViewController.mm
          grep -q 'showScriptLogs' stream-app/app/ScriptsViewController.mm
          grep -q 'log_tail' stream-app/app/ScriptLogViewController.mm
          grep -q 'confirmDeleteEntryAtIndexPath' stream-app/app/ScriptsViewController.mm
          grep -q 'trailingSwipeActionsConfigurationForRowAtIndexPath' stream-app/app/ScriptsViewController.mm
          grep -q 'requestTask:20' stream-app/app/ScriptsViewController.mm

      - name: Build and package TrollStore .tipa
        working-directory: stream-app
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1

      - name: Validate package
        run: |
          set -euo pipefail
          test -f "$TIPA_PATH"
          unzip -l "$TIPA_PATH" | tee stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/Info.plist' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/StreamControl' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/streamd' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/privhelper' stream-app/packages/StreamControl.tipa.contents.txt

          APP="stream-app/app/.theos/_/Applications/StreamControl.app"
          if [ ! -d "$APP" ]; then
            APP=$(find stream-app/app/.theos/_ -maxdepth 8 -name 'StreamControl.app' -type d | head -n1)
          fi
          test -d "$APP"
          test -x "$APP/StreamControl"
          test -x "$APP/streamd"
          test -x "$APP/privhelper"

          echo "--- StreamControl entitlements ---"
          ldid -e "$APP/StreamControl" || true
          echo "--- streamd entitlements ---"
          ldid -e "$APP/streamd" || true
          echo "--- privhelper entitlements ---"
          ldid -e "$APP/privhelper" || true
          echo "--- bundle files ---"
          find "$APP" -maxdepth 2 -type f | sort

      - name: Upload TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: StreamControl-tipa
          path: |
            stream-app/packages/StreamControl.tipa
            stream-app/packages/StreamControl.tipa.contents.txt
          if-no-files-found: error
