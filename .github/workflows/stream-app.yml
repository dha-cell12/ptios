name: Build StreamControl TrollStore

on:
  push:
    paths:
      - 'stream-app/**'
      - 'shared/**'
      - 'license-worker/**'
      - 'license-task-policy.json'
      - 'scripts/**'
      - 'docs/license-*.md'
      - 'tlinkauto-jsd/**'
      - '.github/workflows/stream-app.yml'
  pull_request:
    paths:
      - 'stream-app/**'
      - 'shared/**'
      - 'license-worker/**'
      - 'license-task-policy.json'
      - 'scripts/**'
      - 'docs/license-*.md'
      - 'tlinkauto-jsd/**'
      - '.github/workflows/stream-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        license_mode: [observe, enforced]
    env:
      THEOS: ${{ github.workspace }}/theos
      APP_NAME: StreamControl
      APP_BUNDLE: StreamControl.app
      TIPA_PATH: stream-app/packages/StreamControl.tipa
      TLINK_LICENSE_MODE: ${{ matrix.license_mode }}
      TLINK_LICENSE_ENDPOINT: ${{ vars.TLINK_LICENSE_ENDPOINT != '' && vars.TLINK_LICENSE_ENDPOINT || 'https://tlinkauto-license.tlinkauto.workers.dev' }}
      TLINK_LICENSE_KEY_ID: ${{ vars.TLINK_LICENSE_KEY_ID != '' && vars.TLINK_LICENSE_KEY_ID || 'tlinkauto-test-2026-01' }}
      TLINK_LICENSE_PUBLIC_KEY_X: ${{ vars.TLINK_LICENSE_PUBLIC_KEY_X != '' && vars.TLINK_LICENSE_PUBLIC_KEY_X || 'fUrcjnIX_Ej5jvv9oGqY9kmoY0PbZmXPg5lzUnTeo38' }}
      TLINK_LICENSE_PUBLIC_KEY_Y: ${{ vars.TLINK_LICENSE_PUBLIC_KEY_Y != '' && vars.TLINK_LICENSE_PUBLIC_KEY_Y || 'bVsC_64-AH4cT5aObcm0NnOzY_nY5cYC2EgVhXFSNhE' }}
      TLINK_LICENSE_ENFORCEMENT: ${{ matrix.license_mode == 'enforced' && 'true' || 'false' }}
      TLINK_LICENSE_FORCE_ENFORCEMENT: ${{ matrix.license_mode == 'enforced' && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public license build inputs
        run: |
          set -euo pipefail
          case "$TLINK_LICENSE_MODE" in
            observe|enforced) ;;
            *) echo "Unknown license mode: $TLINK_LICENSE_MODE"; exit 1 ;;
          esac
          case "$TLINK_LICENSE_ENDPOINT" in
            https://*) ;;
            *) echo "License endpoint must use HTTPS"; exit 1 ;;
          esac
          ! printf '%s' "$TLINK_LICENSE_ENDPOINT" | grep -Eqi 'REPLACE_|localhost|127\.0\.0\.1'
          ! printf '%s' "$TLINK_LICENSE_KEY_ID" | grep -Eqi 'REPLACE_'
          printf '%s' "$TLINK_LICENSE_PUBLIC_KEY_X" | grep -Eq '^[A-Za-z0-9_-]{43}$'
          printf '%s' "$TLINK_LICENSE_PUBLIC_KEY_Y" | grep -Eq '^[A-Za-z0-9_-]{43}$'
          if [ "$TLINK_LICENSE_ENFORCEMENT" = "true" ]; then
            test "$TLINK_LICENSE_FORCE_ENFORCEMENT" = "1"
          else
            test "$TLINK_LICENSE_FORCE_ENFORCEMENT" = "0"
          fi

      - name: Configure public license verifier
        run: |
          set -euo pipefail
          PLIST="stream-app/app/LicenseConfig.plist"
          if [ -n "${TLINK_LICENSE_ENDPOINT:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :LicenseEndpoint $TLINK_LICENSE_ENDPOINT" "$PLIST"
          fi
          if [ -n "${TLINK_LICENSE_KEY_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :LicenseKeyID $TLINK_LICENSE_KEY_ID" "$PLIST"
          fi
          if [ -n "${TLINK_LICENSE_PUBLIC_KEY_X:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :LicensePublicKeyX $TLINK_LICENSE_PUBLIC_KEY_X" "$PLIST"
          fi
          if [ -n "${TLINK_LICENSE_PUBLIC_KEY_Y:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :LicensePublicKeyY $TLINK_LICENSE_PUBLIC_KEY_Y" "$PLIST"
          fi
          if [ "${TLINK_LICENSE_ENFORCEMENT:-false}" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Set :LicenseEnforcementEnabled true" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Set :LicenseEnforcementEnabled false" "$PLIST"
          fi
          plutil -lint "$PLIST"

      - name: Install dependencies
        run: |
          set -euxo pipefail
          brew install ldid xz

      - name: Set up Theos
        run: |
          set -euo pipefail
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Download iOS SDKs
        run: |
          set -euo pipefail
          cd "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk . || true
          rm -rf sdks-master sdks.zip
          test -n "$(find . -maxdepth 1 -name '*.sdk' -type d | head -n1)"
          ls -1

      - name: Sanity check StreamControl sources
        run: |
          set -euo pipefail
          test -f stream-app/Makefile
          test -f stream-app/app/Makefile
          test -f stream-app/streamd/Makefile
          test -f shared/TLinkJSFileHandle.h
          test -f shared/TLinkJSFileHandle.mm
          test -f tlinkauto-jsd/Makefile
          test -f tlinkauto-jsd/TLinkJSHelperServer.mm
          test -f pccontrol/jsruntime/TLinkautoDeviceBridge.h
          test -f stream-app/clipboardd/Makefile
          test -f stream-app/clipboardd/main.mm
          test -f stream-app/clipboardd/entitlements.plist
          test -f stream-app/privhelper/Makefile
          test -f stream-app/privhelper/main.mm
          test -f shared/TLinkLicenseVerifier.h
          test -f shared/TLinkLicenseVerifier.mm
          test -f stream-app/app/LicenseManager.mm
          test -f stream-app/app/LicenseLifecycleCoordinator.h
          test -f stream-app/app/LicenseLifecycleCoordinator.mm
          test -f stream-app/app/LicenseViewController.mm
          test -f stream-app/app/LicenseConfig.plist
          test -f license-worker/src/index.js
          test -f license-worker/test/worker.test.mjs
          test -f license-worker/schema.sql
          test -f license-worker/wrangler.jsonc
          test -f scripts/check-license-recovery.mjs
          test -f scripts/validate-license-artifact.mjs
          test -f scripts/check-license-release-readiness.mjs
          test -f scripts/Test-TLinkLicensePhase6.ps1
          test -f scripts/Start-TLinkLicenseSoak.ps1
          test -f scripts/Collect-TLinkOCRBaseline.ps1
          test -f scripts/check-vpn-p0-baseline.mjs
          test -f docs/license-phase6-release-gate.md
          test -f docs/ocr-p0-baseline.md
          test -f docs/ocr-p1-cpu-only.md
          test -f docs/ocr-p1-device-findings.md
          test -f docs/vpn-p0-baseline.md
          node --check license-worker/src/index.js
          node --check license-worker/scripts/generate-keys.mjs
          node --test license-worker/test/worker.test.mjs
          node scripts/check-license-task-policy.mjs
          node scripts/check-license-recovery.mjs
          node scripts/check-ocr-p0-baseline.mjs
          node scripts/check-ocr-p1-cpu-only.mjs
          node scripts/check-vpn-p0-baseline.mjs
          node --check scripts/validate-license-artifact.mjs
