      - name: Build and package TrollStore .tipa
        working-directory: stream-app
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1

      - name: Validate package
        run: |
          set -euo pipefail
          test -f "$TIPA_PATH"
          unzip -l "$TIPA_PATH" | tee stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/Info.plist' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/StreamControl' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/streamd' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/clipboardd' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/privhelper' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/LicenseConfig.plist' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/CompatibilityExamples/01 Runtime Storage.js' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/CompatibilityExamples/06 App Process Shell.js' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/CompatibilityExamples/07 File Handle.js' stream-app/packages/StreamControl.tipa.contents.txt
          grep 'Payload/StreamControl.app/CompatibilityExamples/08 License Heartbeat.js' stream-app/packages/StreamControl.tipa.contents.txt

          APP="stream-app/app/.theos/_/Applications/StreamControl.app"
          if [ ! -d "$APP" ]; then
            APP=$(find stream-app/app/.theos/_ -maxdepth 8 -name 'StreamControl.app' -type d | head -n1)
          fi
          test -d "$APP"
          test -x "$APP/StreamControl"
          test -x "$APP/streamd"
          test -x "$APP/clipboardd"
          test -x "$APP/privhelper"
          test -f "$APP/LicenseConfig.plist"
          test -f "$APP/CompatibilityExamples/01 Runtime Storage.js"
          test -f "$APP/CompatibilityExamples/06 App Process Shell.js"
          test -f "$APP/CompatibilityExamples/07 File Handle.js"
          test -f "$APP/CompatibilityExamples/08 License Heartbeat.js"

          echo "--- StreamControl entitlements ---"
          ldid -e "$APP/StreamControl" || true
          echo "--- streamd entitlements ---"
          ldid -e "$APP/streamd" || true
          echo "--- clipboardd entitlements ---"
          ldid -e "$APP/clipboardd" || true
          echo "--- privhelper entitlements ---"
          ldid -e "$APP/privhelper" || true
          echo "--- bundle files ---"
          find "$APP" -maxdepth 2 -type f | sort

          node scripts/validate-license-artifact.mjs \
            --app "$APP" \
            --tipa "$TIPA_PATH" \
            --mode "$TLINK_LICENSE_MODE" \
            --endpoint "$TLINK_LICENSE_ENDPOINT" \
            --keyId "$TLINK_LICENSE_KEY_ID" \
            --publicKeyX "$TLINK_LICENSE_PUBLIC_KEY_X" \
            --publicKeyY "$TLINK_LICENSE_PUBLIC_KEY_Y" \
            --output "stream-app/packages/license-build-$TLINK_LICENSE_MODE.json"

      - name: Upload TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: StreamControl-tipa-${{ matrix.license_mode }}
          path: |
            stream-app/packages/StreamControl.tipa
            stream-app/packages/StreamControl.tipa.contents.txt
            stream-app/packages/license-build-${{ matrix.license_mode }}.json
          if-no-files-found: error
