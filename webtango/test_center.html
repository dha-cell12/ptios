<style>
.screen-canvas-wrapper {
    background: #0f172a;
    width: 300px;
    height: 600px; /* portrait wrapper */
    display: flex;
    align-items: center;
    justify-content: center;
}
.screen-canvas-wrapper canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #090d16;
}
</style>
<div class='screen-canvas-wrapper'>
  <canvas id='target' width='1920' height='1080' style='border:1px solid red;'></canvas>
</div>
<script>
  const canvas = document.getElementById('target');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'blue';
  // Simulate drawing a 1080x1920 portrait image at 0,0
  ctx.fillRect(0, 0, 1080, 1920);
</script>
